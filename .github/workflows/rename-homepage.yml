name: Rename homepage file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded homepage to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm index.html
          git mv bump-bloom-demo-website.html index.html
          git status --short
          git commit -m "Rename uploaded homepage to index.html"
          git push
