name: Rename homepage export to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename homepage export to index.html
        run: |
          if [ -f bump-bloom-demo-website.html ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mv -f bump-bloom-demo-website.html index.html
            git add -A
            git commit -m "Rename homepage export to index.html"
            git push
          else
            echo "bump-bloom-demo-website.html not found; nothing to rename"
          fi
