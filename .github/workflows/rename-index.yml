name: rename-index
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rename-index.yml'
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git mv -f index-new.html index.html
          git commit -m "Rename index-new.html to index.html"
          git push
